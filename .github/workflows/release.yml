name: Release

# Pushing a tag vX.Y.Z builds Slop Factory X.Y.Z for Windows, Linux and macOS and publishes a
# GitHub release with the installers.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  create:
    name: Create the release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # A draft until every platform has uploaded, so nobody downloads a half-finished release.
      - id: release
        run: |
          name="Slop Factory ${{ steps.version.outputs.version }}"
          # Reuse this tag's release if there is one: published, a draft, or a draft left untagged
          # when the tag was moved (it keeps its name). Drafts can't be fetched by tag, so search
          # the list.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\" or (.draft and .name == \"$name\")) | .id" | head -n 1)
          if [ -z "$id" ]; then
            # The create call returns the id; a list right after creating can miss the new draft.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" -f name="$name" \
              -F draft=true -F generate_release_notes=true --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "::error::Couldn't find or create a release for $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Uploading to release $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build (${{ matrix.name }})
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
            node: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
          - name: Linux amd64
            os: ubuntu-22.04
            node: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm,appimage
          - name: macOS universal
            os: macos-latest
            node: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sidecar/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Set the version from the tag
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.create.outputs.version }}"
      - run: npm ci
      - run: npm --prefix sidecar ci
      - name: Both Mac engines for the universal app
        if: runner.os == 'macOS'
        run: node scripts/fetch-sdk-binaries.mjs darwin-x64 darwin-arm64
      # The installers carry Node, so nobody has to install it to run the app.
      - name: Node.js for the installer
        run: node scripts/fetch-node.mjs ${{ matrix.node }}
      - name: Drop the musl engine from the glibc Linux packages
        if: runner.os == 'Linux'
        run: rm -rf sidecar/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.create.outputs.release_id }}
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
