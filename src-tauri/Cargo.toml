[package]
name = "slop-factory"
version = "0.1.0"
description = "A desktop app for running coding agents on your projects, with a live task board"
license = "BSD-3-Clause"
authors = ["Darren Horrocks"]
edition = "2021"

[lib]
name = "slop_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
tauri-plugin-notification = "2"
